<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>monologus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 36px 24px;
    text-align: center;
  }

  header h1 {
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 0.45em;
    text-transform: lowercase;
    color: #fff;
    padding-left: 0.45em;
  }

  header .episode {
    margin-top: 9px;
    font-size: 9px;
    letter-spacing: 0.28em;
    color: #5a5a5a;
    padding-left: 0.28em;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .code {
    display: grid;
    grid-template-columns: repeat(6, 48px);
    gap: 12px;
  }

  @media (max-width: 520px) {
    .code { grid-template-columns: repeat(4, 44px); gap: 10px; }
    .code input { width: 44px; height: 52px; font-size: 18px; }
  }

  .code input {
    width: 48px;
    height: 56px;
    background: transparent;
    border: 1px solid #2a2a2a;
    color: #fff;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 20px;
    text-align: center;
    text-transform: uppercase;
    outline: none;
    border-radius: 0;
    transition: border-color 0.15s ease;
    caret-color: #fff;
    -webkit-appearance: none;
    appearance: none;
    padding: 0;
  }

  .code input:focus {
    border-color: #fff;
  }

  .code input.filled {
    border-color: #555;
  }

  .code.error input {
    border-color: #8a2a2a;
    animation: shake 0.35s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-4px); }
    75%      { transform: translateX(4px); }
  }

  .hint {
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #444;
    padding: 0 24px 36px;
    min-height: 14px;
    transition: color 0.2s;
  }
</style>
</head>
<body>

<header>
  <h1>monologus</h1>
  <div class="episode">Episode 8</div>
</header>

<main>
  <div class="code" id="code"></div>
</main>

<div class="hint" id="hint"></div>

<script>
(function () {
  'use strict';

  const LOCKED = true;

  const K = 0x5A;

  function dec(hex) {
    let s = '';
    for (let i = 0; i < hex.length; i += 2) {
      s += String.fromCharCode(parseInt(hex.substr(i, 2), 16) ^ K);
    }
    return s;
  }

  function hash(str) {
    let a = 0x811c9dc5, b = 0x811c9dc5, c = 0x811c9dc5, d = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      a = Math.imul(a ^ ch,             0x01000193);
      b = Math.imul(b ^ (ch + i),       0x01000193);
      c = Math.imul(c ^ (ch * 31 + i),  0x01000193);
      d = Math.imul(d ^ (ch ^ i),       0x01000193);
    }
    return (a >>> 0).toString(16).padStart(8, '0') +
           (b >>> 0).toString(16).padStart(8, '0') +
           (c >>> 0).toString(16).padStart(8, '0') +
           (d >>> 0).toString(16).padStart(8, '0');
  }

  const _O = {
    s1: '1715141516151d0f096b6869',   
    n1: '343f222e74322e3736'          
  };

  const T = {};
  for (const k in _O) T[hash(dec(_O[k]))] = k;

  const NEXT_HEX  = _O.n1;
  const SECRET_ID = 's1';

  for (const k in _O) delete _O[k];

  const idOf = s => T[hash(s)];

  /* ===== DOM ===== */
  const LEN = 12;
  const codeEl = document.getElementById('code');
  const hintEl = document.getElementById('hint');
  const inputs = [];

  for (let i = 0; i < LEN; i++) {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.maxLength = 1;
    inp.autocapitalize = 'characters';
    inp.autocomplete = 'off';
    inp.spellcheck = false;
    inp.setAttribute('aria-label', 'символ ' + (i + 1));
    codeEl.appendChild(inp);
    inputs.push(inp);
  }

  function updateFilled() {
    inputs.forEach(i => i.classList.toggle('filled', i.value !== ''));
  }

  function check() {
    const val = inputs.map(i => i.value.toUpperCase()).join('');
    if (val.length < LEN) { hintEl.textContent = ''; return; }

    /* -------- при LOCKED всегда провал -------- */
    const granted = !LOCKED && idOf(val) === SECRET_ID;

    if (granted) {
      hintEl.style.color = '#fff';
      hintEl.textContent = 'access granted';
      setTimeout(() => { window.location.href = dec(NEXT_HEX); }, 450);
    } else {
      codeEl.classList.add('error');
      hintEl.style.color = '#8a2a2a';
      hintEl.textContent = 'incorrect';
      setTimeout(() => {
        codeEl.classList.remove('error');
        inputs.forEach(i => i.value = '');
        inputs[0].focus();
        updateFilled();
        hintEl.textContent = '';
      }, 650);
    }
  }

  inputs.forEach((inp, idx) => {
    inp.addEventListener('input', (e) => {
      const cleaned = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      e.target.value = cleaned.slice(-1);
      updateFilled();
      if (e.target.value && idx < LEN - 1) inputs[idx + 1].focus();
      if (inputs.every(i => i.value !== '')) check();
    });

    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value && idx > 0) {
        inputs[idx - 1].focus();
        inputs[idx - 1].value = '';
        updateFilled();
        e.preventDefault();
      }
      if (e.key === 'ArrowLeft'  && idx > 0)       { inputs[idx - 1].focus(); e.preventDefault(); }
      if (e.key === 'ArrowRight' && idx < LEN - 1) { inputs[idx + 1].focus(); e.preventDefault(); }
      if (e.key === 'Enter') check();
    });

    inp.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData.getData('text') || '')
        .replace(/[^a-zA-Z0-9]/g, '')
        .toUpperCase()
        .slice(0, LEN - idx);
      for (let i = 0; i < text.length; i++) inputs[idx + i].value = text[i];
      updateFilled();
      inputs[Math.min(idx + text.length, LEN - 1)].focus();
      if (inputs.every(i => i.value !== '')) check();
    });

    inp.addEventListener('focus', () => inp.select());
  });

  inputs[0].focus();
})();
</script>
</body>
</html>
