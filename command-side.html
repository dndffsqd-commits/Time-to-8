<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAP — Command Side</title>
<style>
  :root{
    --bg:#000;
    --fg:#d4d4d4;
    --dim:#636363;
    --green:#8ef0b0;
    --red:#ff5555;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:"Cascadia Mono","Consolas","Courier New",monospace;
    font-size:15px;
    line-height:1.55;
    overflow:hidden;
  }
  #screen{
    height:100%;
    overflow-y:auto;
    padding:24px 28px 48px;
    cursor:text;
    scrollbar-width:thin;
    scrollbar-color:#2a2a2a #000;
  }
  #screen::-webkit-scrollbar{width:8px;}
  #screen::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px;}

  #output > div{white-space:pre-wrap;overflow-wrap:break-word;}

  .line-cmd .prompt{color:var(--green);}
  .ok{color:var(--green);}
  .err{color:var(--red);}
  .dim{color:var(--dim);}

  #inputLine{
    display:flex;
    align-items:baseline;
    margin-top:2px;
  }
  #inputLine .prompt{
    color:var(--green);
    white-space:nowrap;
    text-shadow:0 0 8px rgba(142,240,176,.35);
  }
  #cmd{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--fg);
    font:inherit;
    padding-left:1ch;
    caret-color:var(--green);
  }

  .img-block{margin:12px 0 16px;}
  .img-block .cap{
    color:var(--dim);
    font-size:12px;
    letter-spacing:.1em;
    margin-bottom:6px;
  }
  .img-block .cap.err{color:var(--red);}
  .img-block img{
    display:block;
    max-width:min(520px,100%);
    border:1px solid #2f2f2f;
    background:#050505;
  }
  .img-row{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin:12px 0 16px;
  }
  .img-row .img-block{margin:0;}
  .img-row img{max-width:min(240px,100%);}

  audio{
    display:block;
    margin:4px 0 0;
    width:min(420px,100%);
    height:34px;
    filter:invert(1) hue-rotate(180deg);
    opacity:.85;
  }

  #confirmOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    backdrop-filter:blur(2px);
  }
  #confirmOverlay.show{display:flex;}
  .confirm-box{
    min-width:min(360px,90vw);
    background:#050505;
    border:1px solid #2f2f2f;
    padding:22px 24px 18px;
    box-shadow:0 0 30px rgba(142,240,176,.12);
  }
  .confirm-box p{
    color:var(--fg);
    font-size:14px;
    letter-spacing:.03em;
    margin-bottom:18px;
  }
  .confirm-btns{
    display:flex;
    gap:10px;
    justify-content:flex-end;
  }
  .confirm-btns button{
    background:transparent;
    border:1px solid rgba(255,255,255,.35);
    color:var(--fg);
    font:inherit;
    font-size:12px;
    letter-spacing:.16em;
    text-transform:uppercase;
    padding:7px 16px;
    cursor:pointer;
    transition:all .25s ease;
    border-radius:3px;
  }
  .confirm-btns button:hover{
    border-color:var(--green);
    color:var(--green);
    box-shadow:0 0 12px rgba(142,240,176,.35);
  }
</style>
</head>
<body>

<div id="screen">
  <div id="output"></div>
  <div id="inputLine">
    <span class="prompt">IAP:/security/cmd&gt;</span>
    <input id="cmd" type="text" autocomplete="off" spellcheck="false" autofocus>
  </div>
</div>

<div id="confirmOverlay">
  <div class="confirm-box">
    <p>Хотите покинуть этот сайт?</p>
    <div class="confirm-btns">
      <button id="confirmOk">ОК</button>
      <button id="confirmCancel">Отмена</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const K = 0x5A;

  function dec(hex) {
    let s = '';
    for (let i = 0; i < hex.length; i += 2) {
      s += String.fromCharCode(parseInt(hex.substr(i, 2), 16) ^ K);
    }
    return s;
  }

  function hash(str) {
    let a = 0x811c9dc5, b = 0x811c9dc5, c = 0x811c9dc5, d = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      a = Math.imul(a ^ ch,             0x01000193);
      b = Math.imul(b ^ (ch + i),       0x01000193);
      c = Math.imul(c ^ (ch * 31 + i),  0x01000193);
      d = Math.imul(d ^ (ch ^ i),       0x01000193);
    }
    return (a >>> 0).toString(16).padStart(8, '0') +
           (b >>> 0).toString(16).padStart(8, '0') +
           (c >>> 0).toString(16).padStart(8, '0') +
           (d >>> 0).toString(16).padStart(8, '0');
  }

  const _O = {
    c1:  '36353d',
    c2:  '3e332931',
    c3:  '2a32352e35',
    c4:  '29352f343e',
    c5:  '743e283b2d33343d29',
    c6:  '7429233738353629',
    c7:  '743633292e',
    c8:  '74332c3f3e31',

    a1:  '77373328283528',
    a2:  '383b293339772939333f342e33292e7a6b',
    a3:  '6b',
    a4:  '6b7729332c34',
    a5:  '6877383b293339772939333f342e33292e',
    a6:  '6b6b6a6b',
    a7:  '29332e3f',

    p1:  '0a0c0d09686a6a6b',

    f1:  '2a32352e3529756b742a343d',
    f2:  '2a32352e35297568742a343d',
    f3:  '2a32352e3529756974170a69',
    f4:  '2a32352e3529756e742a343d',
    f5:  '2a32352e3529756f726b73742a343d',
    f6:  '2a32352e3529756f726873742a343d',
    f7:  '2a32352e3529756f726973742a343d'
  };

  const FILE = {
    f1: dec(_O.f1), f2: dec(_O.f2), f3: dec(_O.f3), f4: dec(_O.f4),
    f5: dec(_O.f5), f6: dec(_O.f6), f7: dec(_O.f7)
  };

  const T = {};
  for (const k in _O) {
    if (k[0] === 'f') continue;
    T[hash(dec(_O[k]))] = k;
  }

  for (const k in _O) delete _O[k];

  const screenEl = document.getElementById('screen');
  const outputEl = document.getElementById('output');
  const inputEl  = document.getElementById('cmd');
  const PROMPT   = 'IAP:/security/cmd>';

  const overlay   = document.getElementById('confirmOverlay');
  const btnOk     = document.getElementById('confirmOk');
  const btnCancel = document.getElementById('confirmCancel');

  const state = { authed: false, disk: false };

  function scrollBottom(){ screenEl.scrollTop = screenEl.scrollHeight; }

  function printNode(node){
    outputEl.appendChild(node);
    scrollBottom();
    return node;
  }

  function print(text, cls){
    const div = document.createElement('div');
    if (cls) div.className = cls;
    div.textContent = text;
    return printNode(div);
  }
  const ok  = t => print(t, 'ok');
  const err = t => print(t, 'err');
  const dim = t => print(t, 'dim');

  function echoCommand(raw){
    const div = document.createElement('div');
    div.className = 'line-cmd';
    const p = document.createElement('span');
    p.className = 'prompt';
    p.textContent = PROMPT + ' ';
    div.appendChild(p);
    div.appendChild(document.createTextNode(raw));
    printNode(div);
  }

  function makeImgBlock(src){
    const block = document.createElement('div');
    block.className = 'img-block';
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = src.split('/').pop();
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.onerror = function(){
      img.remove();
      cap.className = 'cap err';
      cap.textContent = 'FILE NOT FOUND';
    };
    block.appendChild(cap);
    block.appendChild(img);
    return block;
  }

  function showImages(paths){
    if (paths.length === 1){
      printNode(makeImgBlock(paths[0]));
    } else {
      const row = document.createElement('div');
      row.className = 'img-row';
      paths.forEach(p => row.appendChild(makeImgBlock(p)));
      printNode(row);
    }
  }

  function showAudio(src){
    const block = document.createElement('div');
    block.className = 'img-block';
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = src.split('/').pop();
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.preload = 'none';
    audio.src = src;
    audio.onerror = function(){
      audio.remove();
      cap.className = 'cap err';
      cap.textContent = 'FILE NOT FOUND';
    };
    block.appendChild(cap);
    block.appendChild(audio);
    printNode(block);
  }

  function requireAuth(){
    if (state.authed) return true;
    err('ACCESS DENIED — authorization required');
    return false;
  }
  function requireDisk(){
    if (!state.authed){
      err('ACCESS DENIED — authorization required');
      return false;
    }
    if (!state.disk){
      err('DISK NOT MOUNTED — run "disk 1"');
      return false;
    }
    return true;
  }

  let pendingTarget = null;

  function openConfirm(target){
    pendingTarget = target;
    overlay.classList.add('show');
    setTimeout(function(){ btnOk.focus(); }, 30);
  }

  function closeConfirm(){
    overlay.classList.remove('show');
    pendingTarget = null;
    inputEl.focus();
  }

  btnOk.addEventListener('click', function(){
    const target = pendingTarget;
    overlay.classList.remove('show');
    pendingTarget = null;
    if (target) window.location.href = target;
  });

  btnCancel.addEventListener('click', function(){
    closeConfirm();
    print('navigation cancelled', 'dim');
  });

  overlay.addEventListener('click', function(e){
    if (e.target === overlay) closeConfirm();
  });

  document.addEventListener('keydown', function(e){
    if (overlay.classList.contains('show') && e.key === 'Escape'){
      e.preventDefault();
      closeConfirm();
    }
  });

  const idOf = s => T[hash(s)];

  function handle(raw){
    const input = raw.trim();
    if (!input) return;

    echoCommand(input);

    const parts  = input.split(/\s+/);
    const cmdStr = parts[0];
    const args   = parts.slice(1);
    const argStr = args.join(' ');

    const cmdId = idOf(cmdStr.toLowerCase());

    switch (cmdId){

      case 'c5': {
        if (idOf(argStr.toLowerCase()) === 'a1'){
          showImages([FILE.f1]);
        } else {
          err('usage: .drawings -MIRROR');
        }
        break;
      }

      case 'c6':
        err('error not found');
        break;

      case 'c7': {
        if (idOf(argStr.toLowerCase()) === 'a2'){
          showImages([FILE.f4]);
        } else {
          err('.list: object not found');
        }
        break;
      }

      case 'c8': {
        if (idOf(argStr.toLowerCase()) === 'a7'){
          openConfirm('monologus.html');
        } else {
          err('usage: .IVEDK site');
        }
        break;
      }

      case 'c1': {
        if (!argStr){
          err('usage: log <password>');
          break;
        }
        if (idOf(argStr) === 'p1'){
          state.authed = true;
          state.disk   = false;
          ok('ACCESS GRANTED — security level 2');
          dim('authorized commands: disk / photo / sound');
        } else {
          state.authed = false;
          err('ACCESS DENIED — invalid credentials');
        }
        break;
      }

      case 'c2': {
        if (!requireAuth()) break;
        if (idOf(argStr.toLowerCase()) === 'a3'){
          state.disk = true;
          ok('DISK 1 MOUNTED — photo archive available');
        } else {
          err('disk not found');
        }
        break;
      }

      case 'c3': {
        if (!requireDisk()) break;
        const aid = idOf(argStr.toLowerCase());
        if (aid === 'a4'){
          showImages([FILE.f5, FILE.f6, FILE.f7]);
        } else if (aid === 'a5'){
          showImages([FILE.f2]);
        } else {
          err('photo not found');
        }
        break;
      }

      case 'c4': {
        if (!requireAuth()) break;
        if (idOf(argStr.toLowerCase()) === 'a6'){
          showAudio(FILE.f3);
        } else {
          err('sound not found');
        }
        break;
      }

      case undefined: {
        const low = cmdStr.toLowerCase();
        if (low === 'clear'){ outputEl.innerHTML = ''; break; }
        if (low === 'help'){
          dim([
            'available commands:',
            '  .drawings -MIRROR',
            '  .symbols',
            '  .list basic-scientist 1',
            '  чё?',
            '  log <password>',
            '  disk <n>',
            '  photo <id>',
            '  sound <id>',
            '  clear'
          ].join('\n'));
          break;
        }
        err("'" + parts[0] + "' is not recognized as an internal command");
        break;
      }

      default:
        err("'" + parts[0] + "' is not recognized as an internal command");
    }
  }

  const history = [];
  let hIndex = 0;

  inputEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){
      const value = inputEl.value;
      inputEl.value = '';
      if (value.trim()) history.push(value);
      hIndex = history.length;
      handle(value);
      return;
    }
    if (e.key === 'ArrowUp'){
      e.preventDefault();
      if (history.length && hIndex > 0){
        hIndex--;
        inputEl.value = history[hIndex];
      }
      return;
    }
    if (e.key === 'ArrowDown'){
      e.preventDefault();
      if (hIndex < history.length - 1){
        hIndex++;
        inputEl.value = history[hIndex];
      } else {
        hIndex = history.length;
        inputEl.value = '';
      }
      return;
    }
    if (e.key === 'l' && e.ctrlKey){
      e.preventDefault();
      outputEl.innerHTML = '';
    }
  });

  screenEl.addEventListener('click', function(){
    if (!window.getSelection().toString()) inputEl.focus();
  });
  window.addEventListener('focus', function(){ inputEl.focus(); });

  dim('IAP SECURITY TERMINAL  v2.4');
  dim('link established · encryption active');
  print('');
  inputEl.focus();

})();
</script>
</body>
</html>
